name: Update site

# Rebuilds the forecast data and publishes the site to GitHub Pages.
# Needs: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (minute 17 avoids the busy top of the hour)
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    # The repo's default branch is currently the Claude work branch; "main" is
    # listed so this keeps working if the branch is renamed.
    branches: [main, "claude/weather-watch-football-u7xc7p"]
    paths:
      - "docs/**"
      - "weather_watch/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Stadium coordinates never change, so keep them between runs.
      - name: Restore lookup caches
        uses: actions/cache@v5
        with:
          path: ~/.cache/weather-watch
          key: wx-cache-${{ github.run_id }}
          restore-keys: wx-cache-

      - name: Run tests
        run: python -m unittest

      - name: Run map tests
        run: node --test tests/js/*.test.js

      - uses: actions/configure-pages@v6
        id: pages

      # The live site's data file carries each game's score history; fetch it so
      # this run can add to it. On the very first deploy there is nothing yet.
      # A unique query string (?run=...) gets past the Pages cache, which could otherwise hand back a copy
      # from a few minutes ago.
      - name: Fetch previous data
        run: curl -fsSL --retry 3 --retry-delay 2 "${{ steps.pages.outputs.base_url }}/data.json?run=${{ github.run_id }}" -o previous-data.json || echo "No previous data yet; starting fresh history."

      # The forecast archive can't be rebuilt (the Weather Service keeps observations for only about a week),
      # so a fresh start is allowed only if the site has no results.json yet (404). Any other failure stops
      # the run, which keeps the live site, and the archive on it, exactly as it was.
      - name: Fetch previous forecast archive
        run: |
          code=$(curl -sS -L --retry 3 --retry-delay 2 -o previous-results.json -w '%{http_code}' "${{ steps.pages.outputs.base_url }}/results.json?run=${{ github.run_id }}" || echo 000)
          echo "results.json: HTTP $code"
          if [ "$code" = "404" ]; then
            rm -f previous-results.json
            echo "No forecast archive yet; starting one."
          elif [ "$code" != "200" ]; then
            echo "::error::Could not fetch the forecast archive (HTTP $code). Stopping so it is not reset."
            exit 1
          fi

      # Fails (and keeps the previous site) if the forecast source is down.
      - name: Build data file
        run: python -m weather_watch --site-data docs/data.json --previous previous-data.json --previous-results previous-results.json --results-out docs/results.json

      # Browsers keep a site's files for about 10 minutes, so after a deploy a visitor could get the old
      # script or stylesheet. Stamping their links with this commit makes each deploy a new address.
      # (Only the published copy is stamped; docs/index.html in the repository stays plain.)
      - name: Stamp asset links with the commit
        run: |
          stamp="${GITHUB_SHA::8}"
          for f in style.css map.js app.js; do
            sed -i -E "s#((href|src)=\"$f)\"#\1?v=$stamp\"#" docs/index.html
          done
          grep -c "?v=$stamp" docs/index.html | grep -qx 3 || { echo "::error::asset links were not stamped"; exit 1; }

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
