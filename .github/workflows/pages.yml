name: Update site

# Rebuilds the forecast data and publishes the site to GitHub Pages.
# Needs: Settings > Pages > Build and deployment > Source = "GitHub Actions".

on:
  schedule:
    - cron: "17 */3 * * *" # every 3 hours (minute 17 avoids the busy top of the hour)
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "weather_watch/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Stadium coordinates never change, so keep them between runs.
      - name: Restore lookup caches
        uses: actions/cache@v4
        with:
          path: ~/.cache/weather-watch
          key: wx-cache-${{ github.run_id }}
          restore-keys: wx-cache-

      - name: Run tests
        run: python -m unittest

      # Fails (and keeps the previous site) if the forecast source is down.
      - name: Build data file
        run: python -m weather_watch --site-data docs/data.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
